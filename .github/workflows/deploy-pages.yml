name: Mirror main to gh-pages

# GitHub Pages 가 gh-pages 브랜치를 소스로 서비스한다.
# main 에 푸시하면 이 워크플로가 gh-pages 로 그대로 미러링하고, Pages 가 재배포한다.
#
# 왜 이렇게 하는가:
#   Settings → Pages 의 브랜치 소스 저장이 반영되지 않아 Pages 가 아예 비활성
#   (has_pages=false) 이었고 사이트 전체가 404 였다. gh-pages 브랜치를 푸시해
#   Pages 를 활성화했으므로, 앞으로도 그 브랜치가 최신이어야 한다.
#   actions/deploy-pages 방식은 Actions 토큰에 Pages 생성·설정 권한이 없어
#   "Resource not accessible by integration" 으로 실패했다.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror-gh-pages
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify media mix calculations
        run: node --test tests/mix-engine.test.cjs

      - name: Push main to gh-pages
        run: git push origin HEAD:gh-pages --force
